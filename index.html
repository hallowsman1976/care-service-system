<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบดูแลผู้มีภาวะพึ่งพิง — Care Dashboard</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- TailwindCSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Flatpickr + Thai locale -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/th.js"></script>

  <!-- Leaflet Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50">

  <!-- Loading Overlay -->
  <div id="loading-overlay" class="loading-overlay" style="display:none">
    <div class="spinner"></div>
    <p class="mt-3 text-white text-sm">กำลังดำเนินการ...</p>
  </div>

  <!-- Sidebar Container (Desktop) -->
  <div id="sidebar-container" style="display:none">
    <div id="sidebar" class="sidebar">
      <!-- Logo / Header -->
      <div class="sidebar-header">
        <div class="flex items-center gap-3 px-5 py-4">
          <div class="w-10 h-10 rounded-xl bg-blue-100 flex items-center justify-center">
            <i data-lucide="heart-pulse" class="w-5 h-5 text-blue-600"></i>
          </div>
          <div>
            <div class="font-bold text-gray-800 text-sm">Care Dashboard</div>
            <div class="text-xs text-gray-400">ดูแลผู้มีภาวะพึ่งพิง</div>
          </div>
        </div>
      </div>

      <!-- Nav Links -->
      <nav class="sidebar-nav">
        <a class="sidebar-link active" data-page="dashboard" onclick="navigate('dashboard')">
          <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
          <span>ภาพรวม</span>
        </a>
        <a class="sidebar-link" data-page="patients" onclick="navigate('patients')">
          <i data-lucide="users" class="w-5 h-5"></i>
          <span>ผู้มีภาวะพึ่งพิง</span>
        </a>
        <a class="sidebar-link" data-page="caregivers" onclick="navigate('caregivers')">
          <i data-lucide="heart-handshake" class="w-5 h-5"></i>
          <span>Care Giver</span>
        </a>
        <a class="sidebar-link" data-page="assignments" onclick="navigate('assignments')">
          <i data-lucide="link" class="w-5 h-5"></i>
          <span>มอบหมาย</span>
        </a>
        <a class="sidebar-link" data-page="visits" onclick="navigate('visits')">
          <i data-lucide="clipboard-check" class="w-5 h-5"></i>
          <span>บันทึกเยี่ยม</span>
        </a>
        <a class="sidebar-link" data-page="reports" onclick="navigate('reports')">
          <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
          <span>รายงาน</span>
        </a>

        <div class="sidebar-divider"></div>

        <a class="sidebar-link" data-page="settings" onclick="navigate('settings')">
          <i data-lucide="settings" class="w-5 h-5"></i>
          <span>ตั้งค่า</span>
        </a>
        <a class="sidebar-link" data-page="profile" onclick="navigate('profile')">
          <i data-lucide="user" class="w-5 h-5"></i>
          <span>โปรไฟล์</span>
        </a>
        <a class="sidebar-link text-red-500" onclick="logout()">
          <i data-lucide="log-out" class="w-5 h-5"></i>
          <span>ออกจากระบบ</span>
        </a>
      </nav>
    </div>

    <!-- Sidebar overlay (mobile) -->
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
  </div>

  <!-- Main Content Area -->
  <div id="main-wrapper" class="main-wrapper">
    <!-- Top Bar (mobile hamburger) -->
    <header id="topbar" class="topbar">
      <button onclick="toggleSidebar()" class="p-2 rounded-lg hover:bg-gray-100 md:hidden">
        <i data-lucide="menu" class="w-5 h-5 text-gray-600"></i>
      </button>
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-blue-100 flex items-center justify-center">
          <i data-lucide="heart-pulse" class="w-4 h-4 text-blue-600"></i>
        </div>
        <span class="font-bold text-sm text-gray-700">Care Dashboard</span>
      </div>
      <div id="topbar-user" class="text-xs text-gray-500"></div>
    </header>

    <!-- App Content -->
    <main id="app" class="app-content">
      <!-- Content rendered by app.js -->
    </main>
  </div>

  <!-- Bottom Navigation (Mobile) -->
  <nav id="bottom-nav" class="bottom-nav" style="display:none">
    <a class="bottom-nav-item active" data-page="dashboard" onclick="navigate('dashboard')">
      <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
      <span>ภาพรวม</span>
    </a>
    <a class="bottom-nav-item" data-page="patients" onclick="navigate('patients')">
      <i data-lucide="users" class="w-5 h-5"></i>
      <span>ผู้ป่วย</span>
    </a>
    <a class="bottom-nav-item" data-page="visits" onclick="navigate('visits')">
      <i data-lucide="clipboard-check" class="w-5 h-5"></i>
      <span>เยี่ยม</span>
    </a>
    <a class="bottom-nav-item" data-page="reports" onclick="navigate('reports')">
      <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
      <span>รายงาน</span>
    </a>
    <a class="bottom-nav-item" data-page="profile" onclick="navigate('profile')">
      <i data-lucide="user" class="w-5 h-5"></i>
      <span>โปรไฟล์</span>
    </a>
  </nav>

  <!-- Floating Action Button -->
  <button id="fab" class="fab" onclick="navigate('visits')" title="บันทึกเยี่ยม" style="display:none">
    <i data-lucide="plus" class="w-6 h-6"></i>
  </button>

  <!-- Application Script -->
  <script src="app.js"></script>

  <!-- Init Lucide Icons -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      // Show FAB when logged in
      const checkFab = () => {
        const fab = document.getElementById('fab');
        if (fab) fab.style.display = (localStorage.getItem('token')) ? 'flex' : 'none';
      };
      checkFab();
      // Update topbar user
      const updateTopbar = () => {
        const el = document.getElementById('topbar-user');
        const user = JSON.parse(localStorage.getItem('user') || 'null');
        if (el && user) el.textContent = user.fullName || user.username;
      };
      updateTopbar();
      // Observe navigation
      const observer = new MutationObserver(() => { checkFab(); updateTopbar(); lucide.createIcons(); });
      observer.observe(document.getElementById('app'), { childList: true, subtree: true });
    });
  </script>
</body>
</html>
